<script>
  function decodeEmail(encodedString) {
    var email = "";
    for (var i = 0; i < encodedString.length; i++) {
      email += String.fromCharCode(encodedString.charCodeAt(i) - 1);
    }
    window.location.href = "mailto:" + email;
  }
</script>
